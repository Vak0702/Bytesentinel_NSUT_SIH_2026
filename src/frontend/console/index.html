<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DASTAVEZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so a light-mode user does not see a flash of
      // the dark theme while the React bundle boots. Mirrors resolveInitialTheme()
      // in src/context/AppContext.jsx; AppContext re-asserts this on mount.
      (function () {
        try {
          var t = localStorage.getItem("bs.theme");
          if (t !== "light" && t !== "dark") {
            var legacy = JSON.parse(localStorage.getItem("bs.settings") || "null");
            var a = legacy && legacy.appearance && String(legacy.appearance).toLowerCase();
            t = a === "light" || a === "dark" ? a : null;
          }
          if (!t) {
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
